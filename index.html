<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FC Online Simulator (Online & Admin)</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg-dark: #0b0e14;
      --panel-bg: rgba(22, 28, 38, 0.9);
      --accent-green: #00ff88;
      --accent-blue: #00d2ff;
      --accent-gold: #ffb700;
      --accent-red: #ff4757;
      --text-main: #f1f2f6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
    body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }
    header { background: rgba(15, 23, 42, 0.9); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); position: sticky; top: 0; z-index: 100; }
    .logo { font-size: 22px; font-weight: 800; background: linear-gradient(45deg, #00d2ff, #00ff88); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .user-profile { display: flex; align-items: center; gap: 15px; }
    .user-info, .bp-display { background: rgba(255,255,255,0.05); padding: 6px 14px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; gap: 8px; font-size: 14px; }
    .bp-display { color: var(--accent-gold); font-weight: bold; border-color: var(--accent-gold); }
    .btn-logout { background: rgba(255, 71, 87, 0.2); border: 1px solid var(--accent-red); color: var(--accent-red); padding: 6px 14px; border-radius: 12px; cursor: pointer; font-weight: 600; }
    .btn-logout:hover { background: var(--accent-red); color: #fff; }
    nav { display: flex; justify-content: center; gap: 10px; padding: 15px; background: rgba(0,0,0,0.3); }
    .nav-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #aaa; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .nav-btn.active { background: linear-gradient(135deg, var(--accent-blue), var(--accent-green)); color: #000; border-color: transparent; }
    .nav-btn.admin-btn { background: rgba(255, 71, 87, 0.15); border-color: var(--accent-red); color: var(--accent-red); }
    main { flex: 1; padding: 20px; max-width: 1400px; width: 100%; margin: 0 auto; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 20px; margin-top: 20px; }
    .card { width: 170px; height: 250px; background: linear-gradient(145deg, #1e293b, #0f172a); border-radius: 12px; border: 2px solid var(--accent-gold); position: relative; display: flex; flex-direction: column; align-items: center; padding: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.5); }
    .card-top { width: 100%; display: flex; justify-content: space-between; align-items: flex-start; }
    .card-ovr { font-size: 24px; font-weight: 900; color: var(--accent-gold); }
    .card-pos { font-size: 14px; font-weight: 700; color: #fff; }
    .card-img-placeholder { width: 80px; height: 80px; border-radius: 50%; background: rgba(255,255,255,0.1); margin: 15px 0; display: flex; align-items: center; justify-content: center; font-size: 35px; color: rgba(255,255,255,0.3); }
    .card-name { font-size: 15px; font-weight: 800; text-align: center; color: #fff; margin-top: auto; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center; z-index: 1000; }
    .auth-box { background: var(--panel-bg); border: 1px solid rgba(255,255,255,0.15); padding: 40px; border-radius: 16px; width: 360px; text-align: center; }
    .auth-box h2 { margin-bottom: 20px; color: var(--accent-green); font-size: 20px; }
    .input-group { margin-bottom: 20px; text-align: left; }
    .input-group label { display: block; margin-bottom: 6px; font-size: 13px; color: #aaa; }
    .input-group input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.5); color: #fff; outline: none; }
    .btn-submit { width: 100%; padding: 12px; background: linear-gradient(135deg, var(--accent-blue), var(--accent-green)); border: none; border-radius: 8px; font-weight: bold; font-size: 16px; color: #000; cursor: pointer; }
    .shop-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 15px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .action-btn-group { display: flex; gap: 6px; width: 100%; }
    .btn-buy { flex: 1; padding: 6px; border: 1px solid var(--accent-blue); background: rgba(0, 210, 255, 0.2); color: var(--accent-blue); border-radius: 6px; font-weight: bold; cursor: pointer; }
    .btn-buy:hover { background: var(--accent-blue); color: #000; }
    .admin-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    .admin-table th, .admin-table td { padding: 12px; border: 1px solid rgba(255,255,255,0.1); text-align: left; }
    .admin-table th { background: rgba(255,255,255,0.05); color: var(--accent-green); }
    .btn-action { padding: 6px 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .btn-edit { background: var(--accent-gold); color: #000; }
    .btn-delete { background: var(--accent-red); color: #fff; margin-left: 5px; }
  </style>
</head>
<body>

  <!-- Modal Đăng nhập -->
  <div id="loginModal" class="modal-overlay">
    <div class="auth-box">
      <h2><i class="fa-solid fa-cloud"></i> ĐĂNG NHẬP ONLINE</h2>
      <form id="loginForm">
        <div class="input-group">
          <label>Tên Người Chơi:</label>
          <input type="text" id="usernameInput" required placeholder="Nhập tên tài khoản...">
        </div>
        <button type="submit" class="btn-submit">VÀO GAME</button>
      </form>
    </div>
  </div>

  <!-- Header -->
  <header>
    <div class="logo"><i class="fa-solid fa-futbol"></i> FC ONLINE SIMULATOR</div>
    <div class="user-profile">
      <div class="user-info"><i class="fa-solid fa-user"></i> <span id="displayUsername">Khách</span></div>
      <div class="bp-display"><i class="fa-solid fa-coins"></i> <span id="bpCount">0</span> BP</div>
      <button class="btn-logout" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Đăng xuất</button>
    </div>
  </header>

  <!-- Nav -->
  <nav>
    <button class="nav-btn active" onclick="switchTab('shopTab')">CHỢ PHÔI (100 - 135)</button>
    <button class="nav-btn" onclick="switchTab('packTab')">MỞ GÓI THẺ</button>
    <button class="nav-btn" onclick="switchTab('inventoryTab')">KHO THẺ</button>
    <button id="adminNavBtn" class="nav-btn admin-btn" style="display:none;" onclick="switchTab('adminTab')"><i class="fa-solid fa-user-gear"></i> QUẢN LÝ ADMIN</button>
  </nav>

  <!-- Main Content -->
  <main>
    <!-- Chợ Phôi -->
    <div id="shopTab" class="tab-content active">
      <h2>Cửa Hàng Phôi Nâng Cấp (OVR 100 - 135)</h2>
      <div class="grid-container" id="shopGrid"></div>
    </div>

    <!-- Mở Thẻ -->
    <div id="packTab" class="tab-content">
      <h2>Mở Gói Cầu Thủ VIP</h2>
      <div style="margin-top: 20px; display: flex; gap: 15px;">
        <button class="btn-submit" style="width: auto; padding: 12px 24px;" onclick="openPacks(1)">Mở x1</button>
        <button class="btn-submit" style="width: auto; padding: 12px 24px; background: linear-gradient(135deg, #00d2ff, #0055ff);" onclick="openPacks(10)">Mở x10</button>
        <button class="btn-submit" style="width: auto; padding: 12px 24px; background: linear-gradient(135deg, #ff8800, #ff0055);" onclick="openPacks(20)">Mở x20</button>
      </div>
      <div class="grid-container" id="packResultGrid"></div>
    </div>

    <!-- Kho Thẻ -->
    <div id="inventoryTab" class="tab-content">
      <h2>Kho Cầu Thủ & Phôi</h2>
      <div class="grid-container" id="inventoryGrid"></div>
    </div>

    <!-- Admin Panel -->
    <div id="adminTab" class="tab-content">
      <h2 style="color: var(--accent-red);"><i class="fa-solid fa-user-shield"></i> Bảng Quản Lý Người Chơi Trực Tuyến</h2>
      <table class="admin-table">
        <thead>
          <tr>
            <th>Tên Người Chơi</th>
            <th>Số Dư BP</th>
            <th>Số Lượng Thẻ</th>
            <th>Hành Động Admin</th>
          </tr>
        </thead>
        <tbody id="adminUserTable"></tbody>
      </table>
    </div>
  </main>

  <script>
    // CẤU HÌNH FIREBASE CỦA BẠN (Thay thế thông số ở đây)
    const firebaseConfig = {
      apiKey: "AIzaSyA15le2nYFkosPTW7Ebx2lPo7sQgEf7kt8",
      authDomain: "fc-online-simulator.firebaseapp.com",
      databaseURL: "https://fc-online-simulator-default-rtdb.firebaseio.com",
      projectId: "fc-online-simulator",
      storageBucket: "fc-online-simulator.firebasestorage.app",
      messagingSenderId: "220897790682",
      appId: "1:220897790682:web:3f92984ae37d58603cf3e3"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const ADMIN_USERNAME = "admin"; // Đặt tên tài khoản admin của bạn ở đây

    const shopFodderList = [
      { id: 'f100', name: "Phôi 100", ovr: 100, price: 100000000 },
      { id: 'f105', name: "Phôi 105", ovr: 105, price: 500000000 },
      { id: 'f110', name: "Phôi 110", ovr: 110, price: 2000000000 },
      { id: 'f115', name: "Phôi 115", ovr: 115, price: 10000000000 },
      { id: 'f120', name: "Phôi 120", ovr: 120, price: 50000000000 },
      { id: 'f125', name: "Phôi 125", ovr: 125, price: 200000000000 },
      { id: 'f130', name: "Phôi 130", ovr: 130, price: 800000000000 },
      { id: 'f135', name: "Phôi 135", ovr: 135, price: 3000000000000 }
    ];

    let currentUser = null;
    let userData = { bp: 10000000000, inventory: [] };

    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const username = document.getElementById('usernameInput').value.trim();
      if (username) loginOnline(username);
    });

    function loginOnline(username) {
      currentUser = username;
      document.getElementById('displayUsername').innerText = username;
      document.getElementById('loginModal').style.display = 'none';
      
      if (username.toLowerCase() === ADMIN_USERNAME) {
        document.getElementById('adminNavBtn').style.display = 'inline-block';
        listenToAllUsers();
      }

      db.ref('users/' + username).on('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
          userData = data;
          if (!userData.inventory) userData.inventory = [];
        } else {
          userData = { bp: 10000000000, inventory: [] };
          saveDataOnline();
        }
        updateUI();
      });

      renderShop();
    }

    function logout() {
      location.reload();
    }

    function saveDataOnline() {
      if (currentUser) {
        db.ref('users/' + currentUser).set(userData);
      }
    }

    function updateUI() {
      document.getElementById('bpCount').innerText = (userData.bp || 0).toLocaleString('vi-VN');
      renderInventory();
    }

    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      event.currentTarget.classList.add('active');
    }

    function renderShop() {
      const shopGrid = document.getElementById('shopGrid');
      shopGrid.innerHTML = '';
      shopFodderList.forEach(item => {
        shopGrid.innerHTML += `
          <div class="shop-card">
            <div class="card">
              <div class="card-top"><span class="card-ovr">${item.ovr}</span><span class="card-pos">ALL</span></div>
              <div class="card-img-placeholder"><i class="fa-solid fa-cube"></i></div>
              <div class="card-name">${item.name}</div>
            </div>
            <div style="font-weight: bold; color: var(--accent-gold); font-size: 13px;">${(item.price / 1e9).toFixed(1)} Tỷ BP</div>
            <div class="action-btn-group">
              <button class="btn-buy" onclick="buyFodder('${item.id}', 1)">x1</button>
              <button class="btn-buy" onclick="buyFodder('${item.id}', 5)">x5</button>
              <button class="btn-buy" onclick="buyFodder('${item.id}', 10)">x10</button>
            </div>
          </div>
        `;
      });
    }

    function buyFodder(id, qty) {
      const fodder = shopFodderList.find(f => f.id === id);
      const totalCost = fodder.price * qty;
      if (userData.bp < totalCost) { alert("Không đủ BP!"); return; }
      userData.bp -= totalCost;
      if (!userData.inventory) userData.inventory = [];
      for (let i = 0; i < qty; i++) {
        userData.inventory.push({ id: Date.now() + Math.random(), name: fodder.name, ovr: fodder.ovr, grade: 1 });
      }
      saveDataOnline();
      updateUI();
      alert(`Đã mua ${qty}x ${fodder.name}!`);
    }

    function openPacks(count) {
      const resultGrid = document.getElementById('packResultGrid');
      resultGrid.innerHTML = '';
      const names = ["Ronaldo", "Messi", "Mbappe", "Haaland", "Vinicius", "Bellingham", "Zidane", "Gullit", "Pelé", "Ronaldinho"];
      if (!userData.inventory) userData.inventory = [];
      
      for (let i = 0; i < count; i++) {
        const randName = names[Math.floor(Math.random() * names.length)];
        const randOvr = Math.floor(Math.random() * (135 - 100 + 1)) + 100;
        userData.inventory.push({ id: Date.now() + Math.random(), name: randName, ovr: randOvr, grade: 1 });
        
        resultGrid.innerHTML += `
          <div class="card">
            <div class="card-top"><span class="card-ovr">${randOvr}</span><span class="card-pos">FW</span></div>
            <div class="card-img-placeholder"><i class="fa-solid fa-star"></i></div>
            <div class="card-name">${randName}</div>
          </div>
        `;
      }
      saveDataOnline();
      updateUI();
    }

    function renderInventory() {
      const invGrid = document.getElementById('inventoryGrid');
      invGrid.innerHTML = '';
      if (!userData.inventory || userData.inventory.length === 0) {
        invGrid.innerHTML = '<p style="color: #666;">Kho trống...</p>';
        return;
      }
      userData.inventory.forEach(item => {
        invGrid.innerHTML += `
          <div class="card">
            <div class="card-top"><span class="card-ovr">${item.ovr}</span><span class="card-pos">ST</span></div>
            <div class="card-img-placeholder"><i class="fa-solid fa-user"></i></div>
            <div class="card-name">${item.name}</div>
          </div>
        `;
      });
    }

    function listenToAllUsers() {
      db.ref('users').on('value', (snapshot) => {
        const users = snapshot.val();
        const tbody = document.getElementById('adminUserTable');
        tbody.innerHTML = '';

        if (users) {
          Object.keys(users).forEach(uName => {
            const uData = users[uName];
            const cardCount = uData.inventory ? uData.inventory.length : 0;

            tbody.innerHTML += `
              <tr>
                <td><strong>${uName}</strong></td>
                <td style="color: var(--accent-gold);">${(uData.bp || 0).toLocaleString()} BP</td>
                <td>${cardCount} Thẻ</td>
                <td>
                  <button class="btn-action btn-edit" onclick="adminEditBp('${uName}', ${uData.bp || 0})">Sửa BP</button>
                  <button class="btn-action btn-delete" onclick="adminDeleteUser('${uName}')">Xóa User</button>
                </td>
              </tr>
            `;
          });
        }
      });
    }

    function adminEditBp(username, currentBp) {
      const newBp = prompt(`Nhập số tiền BP mới cho tài khoản [${username}]:`, currentBp);
      if (newBp !== null) {
        const parsedBp = parseInt(newBp);
        if (!isNaN(parsedBp)) {
          db.ref(`users/${username}/bp`).set(parsedBp);
          alert(`Đã cập nhật BP cho ${username}!`);
        }
      }
    }

    function adminDeleteUser(username) {
      if (confirm(`Bạn có chắc chắn muốn xóa dữ liệu của tài khoản [${username}] không?`)) {
        db.ref(`users/${username}`).remove();
        alert(`Đã xóa tài khoản ${username}!`);
      }
    }
  </script>
</body>
</html>
